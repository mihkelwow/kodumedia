openapi: 3.1.0
info:
  title: KoduMedia API
  version: 0.8.56
  description: 'Versioned HTTP API shared by the browser client and future TV clients. KoduMedia 0.8.56 stabilizes native AirPlay HLS and buffered DLNA/UPnP playback.'
servers:
- url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Server is running.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - version
                properties:
                  status:
                    type: string
                    const: ok
                  version:
                    type: string
  /system/info:
    get:
      operationId: getSystemInfo
      responses:
        '200':
          description: Compact runtime integration status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /system/settings:
    get:
      operationId: getSystemSettings
      description: Returns editable runtime settings and a live component check. The stored TMDb token is never returned;
        only a masked hint is exposed.
      responses:
        '200':
          description: Public settings and current component status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfiguration'
        '503':
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSystemSettings
      description: Persists settings to the server data directory, applies them immediately, and schedules automatic metadata
        repair when TMDb is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsUpdate'
      responses:
        '200':
          description: Saved settings and component status after applying them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfiguration'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /system/settings/test:
    post:
      operationId: testSystemSettings
      description: Tests candidate executable paths, TMDb credentials, and the IMDb source without persisting them or starting
        a dataset download.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsUpdate'
      responses:
        '200':
          description: Candidate settings and the resulting live component status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfiguration'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /system/storage:
    get:
      operationId: getStorageReport
      description: Reports data-directory usage by category, configured limits, protected free-space reserve, and disk capacity.
      responses:
        '200':
          description: Current storage report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageReport'
        '503':
          $ref: '#/components/responses/Error'
    post:
      operationId: manageStorage
      description: 'Runs safe orphan cleanup or clears inactive optimized video data. File-removing actions are loopback-only and require the X-KoduMedia-Storage: manage intent header.'
      parameters:
      - name: X-KoduMedia-Storage
        in: header
        required: true
        schema:
          type: string
          const: manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageCleanupRequest'
      responses:
        '200':
          description: Cleanup result and refreshed storage report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageCleanupResult'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /system/metadata/imdb/refresh:
    post:
      operationId: refreshIMDbRatings
      description: Starts a background refresh of the configured IMDb title.ratings source. Remote sources use conditional
        HTTP requests and a local server cache; existing catalog ratings are updated afterwards.
      responses:
        '202':
          description: Accepted asynchronous dataset refresh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '503':
          $ref: '#/components/responses/Error'
  /system/update:
    get:
      operationId: getUpdateStatus
      description: Returns the persisted self-update state. Available only to a loopback browser using a loopback Host header.
      responses:
        '200':
          description: Current or most recent update state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      operationId: installUpdate
      description: 'Validates and stages a newer official Windows x64 release ZIP, starts the detached updater helper, and
        requests a graceful server restart. Loopback-only and requires the X-KoduMedia-Update: install intent header.'
      parameters:
      - name: X-KoduMedia-Update
        in: header
        required: true
        schema:
          type: string
          const: install
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - package
              properties:
                package:
                  type: string
                  format: binary
      responses:
        '202':
          description: Package verified and updater helper started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /filesystem/browse:
    get:
      operationId: browseServerFilesystem
      description: Lightweight server-filesystem fallback for LAN clients or Windows service mode. An empty path returns Windows
        drive roots; large directories are capped.
      parameters:
      - name: path
        in: query
        description: Absolute Windows directory path. Omit to list drive roots.
        schema:
          type: string
      - name: files
        in: query
        description: Include files in addition to directories.
        schema:
          type: boolean
          default: false
      - name: extensions
        in: query
        description: Comma-separated file extensions used when files=true.
        schema:
          type: string
          example: .exe,.gz
      - name: extension
        in: query
        description: Repeatable alternative to extensions.
        schema:
          type: string
      responses:
        '200':
          description: Drive roots or directory contents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryListing'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /filesystem/pick:
    post:
      operationId: openNativeWindowsFilePicker
      description: Opens the native Windows Common Item Dialog on the server computer. For safety and correct desktop ownership
        this endpoint accepts only loopback requests. A cancelled dialog returns 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilePickerRequest'
      responses:
        '200':
          description: Selected absolute Windows path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePickerResult'
        '204':
          description: The user cancelled the native dialog.
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /libraries:
    get:
      operationId: listLibraries
      responses:
        '200':
          description: All system and custom libraries.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Library'
    post:
      operationId: createLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - kind
              properties:
                name:
                  type: string
                  minLength: 1
                kind:
                  $ref: '#/components/schemas/LibraryKind'
      responses:
        '201':
          description: Created library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          $ref: '#/components/responses/Error'
  /libraries/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getLibrary
      responses:
        '200':
          description: Library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                kind:
                  $ref: '#/components/schemas/LibraryKind'
      responses:
        '200':
          description: Updated library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteLibrary
      responses:
        '204':
          description: Custom library deleted.
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /libraries/{id}/sources:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: addLibrarySource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              properties:
                path:
                  type: string
                  minLength: 1
                  description: Absolute directory path on the Windows server.
      responses:
        '200':
          description: Library with the new source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /libraries/{id}/sources/{sourceId}:
    parameters:
    - $ref: '#/components/parameters/Id'
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
    delete:
      operationId: removeLibrarySource
      responses:
        '200':
          description: Library after source removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '404':
          $ref: '#/components/responses/Error'
  /libraries/{id}/scan:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: scanLibrary
      description: Starts an asynchronous scan. Files are classified as movies, series episodes or music, series parents are
        generated automatically, and configured metadata providers enrich new or incomplete items in the background.
      responses:
        '202':
          description: Accepted asynchronous scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /jobs/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getJob
      responses:
        '200':
          description: Background job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/Error'
  /media:
    get:
      operationId: listMedia
      parameters:
      - name: libraryId
        in: query
        schema:
          type: string
      - name: seriesId
        in: query
        description: Return episodes belonging to one generated series parent.
        schema:
          type: string
      - name: season
        in: query
        description: Return episodes from one season. Values greater than zero are filtered.
        schema:
          type: integer
          minimum: 1
      - name: type
        in: query
        description: Comma-separated media types.
        schema:
          type: string
          example: movie,series
      - name: search
        in: query
        schema:
          type: string
      - name: genre
        in: query
        description: One genre or a comma-separated list of genres matched with OR semantics.
        schema:
          type: string
          example: Action,Adventure
      - name: yearFrom
        in: query
        schema:
          type: integer
      - name: yearTo
        in: query
        schema:
          type: integer
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - addedAt
          - releaseDate
          - title
          - rating
          - year
          - duration
          - modifiedAt
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Filtered media page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /media/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getMedia
      responses:
        '200':
          description: Media item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '404':
          $ref: '#/components/responses/Error'
  /media/{id}/post-play:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getPostPlay
      description: Returns the next chronological episode when available. If the current episode is the newest available episode,
        returns up to three unwatched movie or series recommendations ranked by shared or related genres. Series recommendations
        include the oldest unwatched playable episode.
      responses:
        '200':
          description: Next-episode and recommendation data for the completed episode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPlay'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /media/{id}/stream:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: streamMedia
      responses:
        '200':
          description: Full media response.
        '206':
          description: Byte-range media response.
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
  /media/{id}/audio/lossless:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: streamLosslessAudio
      description: Lossless browser-compatibility fallback for audio-only media. The source is decoded to PCM WAV without a lossy encoder and keeps the source sample rate and channel layout.
      responses:
        '200':
          description: Chunked lossless PCM WAV stream.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
  /media/{id}/artwork:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getMusicArtwork
      description: Returns local or embedded artwork, an exact Cover Art Archive image, a high-confidence catalog image, or a neutral generated fallback card.
      responses:
        '200':
          description: Album artwork image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
  /music:
    get:
      operationId: getMusicLanding
      parameters:
      - name: libraryId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Music landing page with recently played, recently added, artists, and albums.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicLanding'
        '400':
          $ref: '#/components/responses/Error'
  /music/tracks:
    get:
      operationId: getMusicTracks
      description: Returns a paginated, filterable and sortable view of the complete music library together with filter facets.
      parameters:
      - name: libraryId
        in: query
        required: true
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      - name: artist
        in: query
        schema:
          type: string
      - name: album
        in: query
        schema:
          type: string
      - name: genre
        in: query
        schema:
          type: string
      - name: style
        in: query
        schema:
          type: string
      - name: year
        in: query
        schema:
          type: integer
      - name: codec
        in: query
        schema:
          type: string
      - name: quality
        in: query
        schema:
          type: string
          enum: [lossless, hires, unclassified]
      - name: sort
        in: query
        schema:
          type: string
          enum: [title, artist, album, year, addedAt, duration, quality, lastPlayed]
      - name: order
        in: query
        schema:
          type: string
          enum: [asc, desc]
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Filtered music tracks and available facets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicTrackPage'
        '400':
          $ref: '#/components/responses/Error'
  /music/enrich:
    post:
      operationId: enrichMusicLibrary
      description: Starts a background job that reprocesses music classification and artwork. An omitted libraryId processes every music library.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                libraryId:
                  type: string
      responses:
        '202':
          description: Accepted asynchronous music enrichment job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /music/artists/{artist}:
    parameters:
    - name: artist
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getMusicArtist
      parameters:
      - name: libraryId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Artist and album hierarchy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicArtistDetails'
        '404':
          $ref: '#/components/responses/Error'
  /music/albums/{albumId}:
    parameters:
    - name: albumId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getMusicAlbum
      parameters:
      - name: libraryId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Album and its ordered audio tracks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicAlbumDetails'
        '404':
          $ref: '#/components/responses/Error'
  /media/{id}/metadata/refresh:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: refreshMediaMetadata
      responses:
        '200':
          description: Enriched media item with an official provider title when matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /notifications:
    get:
      operationId: listNotifications
      description: Synchronizes and returns persistent series episode release notifications. Notifications remain in history after the episode becomes available on the server.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Notification history ordered from newest to oldest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '503':
          $ref: '#/components/responses/Error'
  /notifications/read:
    post:
      operationId: markAllNotificationsRead
      description: Marks every current notification as read for this single-profile server installation.
      responses:
        '204':
          description: Notifications were marked as read.
        '503':
          $ref: '#/components/responses/Error'
  /watch/continue:
    get:
      operationId: listContinueWatching
      description: Returns the newest unfinished movie or episode checkpoints. Series are de-duplicated and progress must
        be between one and 95 percent.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
      responses:
        '200':
          description: Ordered unfinished playback items decorated with persistent watch state.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaItem'
        '503':
          $ref: '#/components/responses/Error'
  /media/{id}/watch:
    parameters:
    - $ref: '#/components/parameters/Id'
    put:
      operationId: updateWatchProgress
      description: Atomically stores a single-profile playback checkpoint outside the media catalog so scans and upgrades
        preserve it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchUpdate'
      responses:
        '200':
          description: Persisted watch state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchState'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /series/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getSeriesDetails
      description: Returns a series parent grouped into seasons and ordered episodes.
      responses:
        '200':
          description: Series hierarchy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesDetails'
        '404':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
  /series/{id}/theme:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getSeriesTheme
      description: Serves a cached M4A theme with byte-range support. When the cache is empty, starts one detached server-side preparation job and returns 202 while it continues independently of the browser request.
      responses:
        '200':
          description: Cached series theme audio.
          headers:
            Accept-Ranges:
              schema:
                type: string
                const: bytes
          content:
            audio/mp4:
              schema:
                type: string
                format: binary
        '202':
          description: Theme preparation has started or is already running. Retry after the indicated delay.
          headers:
            Retry-After:
              schema:
                type: integer
                const: 2
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /themes/settings:
    get:
      operationId: getThemePlaybackSettings
      description: Returns the active series-theme playback mode and fixed client playback parameters.
      responses:
        '200':
          description: Series-theme playback configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemePlaybackConfiguration'
    put:
      operationId: updateThemePlaybackSettings
      description: Updates only the series-theme playback mode while preserving all other server settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeMusicSettings'
      responses:
        '200':
          description: Saved series-theme playback configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemePlaybackConfiguration'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /playback/plan:
    post:
      operationId: planPlayback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackRequest'
      responses:
        '200':
          description: Deterministic playback decision without starting FFmpeg.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackPlan'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
  /playback/sessions:
    post:
      operationId: startPlaybackSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackRequest'
      responses:
        '201':
          description: Direct or HLS playback session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSession'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /playback/sessions/{id}/stats:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getPlaybackRuntimeStats
      description: Returns lightweight runtime diagnostics for the active or cached playback session.
      responses:
        '200':
          description: Encoder, generated-segment and fallback diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackRuntimeStats'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /playback/sessions/{id}/{file}:
    parameters:
    - $ref: '#/components/parameters/Id'
    - name: file
      in: path
      required: true
      description: HLS playlist, initialization segment or media segment path.
      schema:
        type: string
    get:
      operationId: getPlaybackFile
      responses:
        '200':
          description: HLS playlist, initialization segment, or media segment.
        '206':
          description: Byte-range segment response.
        '404':
          $ref: '#/components/responses/Error'
  /media/{id}/playback-options:
    parameters:
    - &id002
      $ref: '#/components/parameters/Id'
    get:
      operationId: getPlaybackOptions
      description: Returns selectable audio and subtitle tracks. Old catalog entries are reprobed on demand when technical
        track data is missing.
      responses:
        '200':
          description: Available playback tracks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackOptions'
        '404': &id001
          $ref: '#/components/responses/Error'
        '503': *id001
  /media/{id}/subtitles/search:
    parameters:
    - *id002
    get:
      operationId: searchOnlineSubtitles
      description: Searches OpenSubtitles.com using the media hash, identifiers, title, year and episode data. Requires a
        configured Consumer API key.
      parameters:
      - name: language
        in: query
        description: Repeatable preferred subtitle language.
        schema:
          type: string
      - name: languages
        in: query
        description: Comma-separated preferred subtitle languages.
        schema:
          type: string
      responses:
        '200':
          description: Ranked subtitle results.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubtitleSearchResult'
        '404': *id001
        '503': *id001
  /media/{id}/subtitles/download:
    parameters:
    - *id002
    post:
      operationId: downloadOnlineSubtitle
      description: Downloads a selected OpenSubtitles result into the server data directory and returns a local track.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubtitleDownloadRequest'
      responses:
        '201':
          description: Downloaded subtitle track.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtitleTrack'
        '400': *id001
        '404': *id001
        '503': *id001
  /media/{id}/subtitles/{subtitleId}:
    parameters:
    - *id002
    - name: subtitleId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getSubtitleWebVTT
      description: Converts a text subtitle to cached UTF-8 WebVTT on the server and serves it to the player.
      responses:
        '200':
          description: UTF-8 WebVTT subtitle.
          content:
            text/vtt:
              schema:
                type: string
        '404': *id001
        '415': *id001
        '503': *id001
  /playback/sessions/{id}:
    parameters:
    - *id002
    delete:
      operationId: stopPlaybackSession
      description: Stops FFmpeg and removes the transient playback session.
      responses:
        '204':
          description: Playback session stopped.
        '404': *id001
  /cast/devices:
    get:
      operationId: discoverCastDevices
      description: Discovers DLNA/UPnP MediaRenderer devices reachable from the KoduMedia server on the local network.
      responses:
        '200':
          description: Local-network casting devices ordered by name.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CastDevice'
        '503':
          $ref: '#/components/responses/Error'
  /cast/sessions/active:
    get:
      operationId: getActiveCastSession
      parameters:
      - name: mediaId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Most recently started matching DLNA cast session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CastSession'
        '204':
          description: No active matching cast session.
  /cast/sessions:
    post:
      operationId: startCastSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CastSessionRequest'
      responses:
        '201':
          description: Server-owned playback loaded on the selected DLNA/UPnP device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CastSession'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /cast/sessions/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getCastSessionStatus
      responses:
        '200':
          description: Live transport, position and volume state reported by the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CastSession'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    delete:
      operationId: stopCastSession
      responses:
        '204':
          description: Device playback and its server playback source were stopped.
        '404':
          $ref: '#/components/responses/Error'
  /cast/sessions/{id}/commands:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: commandCastSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CastCommand'
      responses:
        '200':
          description: Updated cast session after the command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CastSession'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /cast/sources:
    post:
      operationId: createBrowserCastSource
      description: Creates a server playback source for a browser-owned Google Cast receiver session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CastSourceRequest'
      responses:
        '201':
          description: Absolute media source ready for the Google Cast Default Media Receiver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CastSource'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /cast/sources/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    delete:
      operationId: stopBrowserCastSource
      responses:
        '204':
          description: Browser-owned cast source was stopped and released.
        '404':
          $ref: '#/components/responses/Error'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Stable API error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LibraryKind:
      type: string
      enum:
      - movies
      - series
      - music
      - mixed
    LibrarySource:
      type: object
      required:
      - id
      - path
      - createdAt
      properties:
        id:
          type: string
        path:
          type: string
        createdAt:
          type: string
          format: date-time
    Library:
      type: object
      required:
      - id
      - name
      - kind
      - system
      - sources
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/LibraryKind'
        system:
          type: boolean
        sources:
          type: array
          items:
            $ref: '#/components/schemas/LibrarySource'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Job:
      type: object
      required:
      - id
      - type
      - status
      - progress
      - createdAt
      properties:
        id:
          type: string
        type:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
        progress:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    MediaType:
      type: string
      enum:
      - movie
      - series
      - episode
      - music
      - unknown
    MediaTrack:
      type: object
      required:
      - index
      - kind
      - codec
      properties:
        index:
          type: integer
        kind:
          type: string
        codec:
          type: string
        language:
          type: string
        title:
          type: string
        channels:
          type: integer
        channelLayout:
          type: string
        sampleRate:
          type: integer
          minimum: 0
        width:
          type: integer
        height:
          type: integer
        streamOrdinal:
          type: integer
          minimum: 0
        bitDepth:
          type: integer
          minimum: 0
        pixelFormat:
          type: string
        colorPrimaries:
          type: string
        colorTransfer:
          type: string
        colorSpace:
          type: string
        hdrFormat:
          type: string
          enum:
          - hdr10
          - hdr10plus
          - hlg
          - dolby-vision
        default:
          type: boolean
        forced:
          type: boolean
        hearingImpaired:
          type: boolean
        codecProfile:
          type: string
        codecLevel:
          type: integer
          minimum: 0
        frameRate:
          type: number
          format: double
          minimum: 0
        bitrate:
          type: integer
          format: int64
          minimum: 0
    PersonCredit:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        character:
          type: string
        role:
          type: string
        imageUrl:
          type: string
          format: uri
    MediaFile:
      type: object
      required:
      - relativePath
      - name
      - extension
      - sizeBytes
      - modifiedAt
      properties:
        path:
          type: string
          description: Absolute file path on the KoduMedia server.
        relativePath:
          type: string
        name:
          type: string
        extension:
          type: string
        sizeBytes:
          type: integer
          format: int64
        modifiedAt:
          type: string
          format: date-time
    TechnicalMetadata:
      type: object
      properties:
        container:
          type: string
        durationMs:
          type: integer
          format: int64
        bitrate:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        videoCodec:
          type: string
        audioCodec:
          type: string
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/MediaTrack'
        audioChannels:
          type: integer
          minimum: 0
        audioSampleRate:
          type: integer
          minimum: 0
        audioBitDepth:
          type: integer
          minimum: 0
        bitDepth:
          type: integer
          minimum: 0
        pixelFormat:
          type: string
        colorPrimaries:
          type: string
        colorTransfer:
          type: string
        colorSpace:
          type: string
        hdrFormat:
          type: string
          enum:
          - hdr10
          - hdr10plus
          - hlg
          - dolby-vision
        probeVersion:
          type: integer
          minimum: 0
        videoProfile:
          type: string
        videoLevel:
          type: integer
          minimum: 0
        frameRate:
          type: number
          format: double
          minimum: 0
    ExternalIds:
      type: object
      properties:
        imdb:
          type: string
        tmdb:
          type: string
        tvdb:
          type: string
        soundcloud:
          type: string
          description: Legacy SoundCloud identifier retained for catalog compatibility.
        musicBrainzRecording:
          type: string
          description: MusicBrainz recording MBID.
        musicBrainzRelease:
          type: string
          description: MusicBrainz release MBID selected for exact artwork matching.
        musicBrainzReleaseGroup:
          type: string
          description: MusicBrainz release-group MBID.
        acoustId:
          type: string
          description: AcoustID result identifier when fingerprint matching was used.
    EditorialMetadata:
      type: object
      properties:
        summary:
          type: string
        tagline:
          type: string
        genres:
          type: array
          items:
            type: string
        cast:
          type: array
          items:
            $ref: '#/components/schemas/PersonCredit'
        directors:
          type: array
          items:
            $ref: '#/components/schemas/PersonCredit'
        posterUrl:
          type: string
          format: uri
        backdropUrl:
          type: string
          format: uri
        logoUrl:
          type: string
          format: uri
        trailerYoutubeKey:
          type: string
          description: YouTube video key for the selected official trailer or teaser.
        trailerName:
          type: string
        trailerCandidates:
          type: array
          description: Ranked YouTube trailer and teaser candidates. The client validates embeddability at playback time and falls back automatically.
          items:
            $ref: '#/components/schemas/TrailerCandidate'
        heroAssetsVersion:
          type: integer
          minimum: 0
          description: Version marker used to backfill homepage logo and trailer assets once.
        imdbRating:
          type: number
          minimum: 0
          maximum: 10
        imdbVotes:
          type: integer
          format: int64
        metadataSource:
          type: string
        officialSeasonCount:
          type: integer
          minimum: 0
        officialEpisodeCount:
          type: integer
          minimum: 0
        latestEpisode:
          $ref: '#/components/schemas/EpisodeReleaseInfo'
        updatedAt:
          type: string
          format: date-time
    TrailerCandidate:
      type: object
      required:
        - youtubeKey
      properties:
        youtubeKey:
          type: string
          description: YouTube video key.
        name:
          type: string
    EpisodeReleaseInfo:
      type: object
      required:
      - season
      - episode
      properties:
        season:
          type: integer
          minimum: 0
        episode:
          type: integer
          minimum: 1
        title:
          type: string
        releaseDate:
          type: string
          format: date-time
    WatchState:
      type: object
      required:
      - mediaId
      - mediaType
      - positionMs
      - durationMs
      - progress
      - completed
      - lastWatchedAt
      - updatedAt
      properties:
        mediaId:
          type: string
        seriesId:
          type: string
        mediaType:
          $ref: '#/components/schemas/MediaType'
        season:
          type: integer
          minimum: 0
        episode:
          type: integer
          minimum: 0
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        progress:
          type: number
          minimum: 0
          maximum: 1
        completed:
          type: boolean
        lastWatchedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WatchUpdate:
      type: object
      required:
      - positionMs
      - durationMs
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        completed:
          type: boolean
          default: false
    MediaItem:
      type: object
      required:
      - id
      - libraryId
      - type
      - title
      - sortTitle
      - file
      - technical
      - externalIds
      - metadata
      - addedAt
      - updatedAt
      properties:
        id:
          type: string
        libraryId:
          type: string
        seriesId:
          type: string
        type:
          $ref: '#/components/schemas/MediaType'
        title:
          type: string
        sortTitle:
          type: string
        year:
          type: integer
        releaseDate:
          type: string
          format: date-time
        season:
          type: integer
        episode:
          type: integer
        episodeTitle:
          type: string
        seriesTitle:
          type: string
        seasonCount:
          type: integer
          minimum: 0
        episodeCount:
          type: integer
          minimum: 0
        artist:
          type: string
        album:
          type: string
        trackNumber:
          type: integer
        discNumber:
          type: integer
        musicClassification:
          $ref: '#/components/schemas/MusicClassification'
        file:
          $ref: '#/components/schemas/MediaFile'
        technical:
          $ref: '#/components/schemas/TechnicalMetadata'
        externalIds:
          $ref: '#/components/schemas/ExternalIds'
        metadata:
          $ref: '#/components/schemas/EditorialMetadata'
        addedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        watch:
          $ref: '#/components/schemas/WatchState'
    PostPlayRecommendation:
      type: object
      required:
      - item
      properties:
        item:
          $ref: '#/components/schemas/MediaItem'
        playTarget:
          $ref: '#/components/schemas/MediaItem'
        sharedGenres:
          type: array
          items:
            type: string
        reason:
          type: string
    PostPlay:
      type: object
      required:
      - recommendations
      properties:
        nextEpisode:
          $ref: '#/components/schemas/MediaItem'
        recommendations:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/PostPlayRecommendation'
    MediaPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    SeasonGroup:
      type: object
      required:
      - number
      - title
      - episodeCount
      - episodes
      properties:
        number:
          type: integer
          minimum: 0
        title:
          type: string
        episodeCount:
          type: integer
          minimum: 0
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
    MusicClassification:
      type: object
      properties:
        genres:
          type: array
          items:
            type: string
        styles:
          type: array
          items:
            type: string
        moods:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [embedded, sidecar, musicbrainz, mixed]
        genreSource:
          type: string
          enum: [embedded, sidecar, musicbrainz]
        styleSource:
          type: string
          enum: [embedded, sidecar, musicbrainz]
        moodSource:
          type: string
          enum: [embedded, sidecar, musicbrainz]
        confidence:
          type: string
          enum: [tagged, verified, matched, fingerprint]
        sourceUrl:
          type: string
          format: uri
          description: Public MusicBrainz recording URL for the matched metadata.
    MusicFacet:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
          minimum: 0
    MusicTrackFacets:
      type: object
      required: [artists, albums, genres, styles, years, codecs, lossless, hiRes, unclassified]
      properties:
        artists:
          type: array
          items:
            $ref: '#/components/schemas/MusicFacet'
        albums:
          type: array
          items:
            $ref: '#/components/schemas/MusicFacet'
        genres:
          type: array
          items:
            $ref: '#/components/schemas/MusicFacet'
        styles:
          type: array
          items:
            $ref: '#/components/schemas/MusicFacet'
        years:
          type: array
          items:
            $ref: '#/components/schemas/MusicFacet'
        codecs:
          type: array
          items:
            $ref: '#/components/schemas/MusicFacet'
        lossless:
          type: integer
          minimum: 0
        hiRes:
          type: integer
          minimum: 0
        unclassified:
          type: integer
          minimum: 0
    MusicTrackPage:
      type: object
      required: [items, total, limit, offset, facets]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
        facets:
          $ref: '#/components/schemas/MusicTrackFacets'
    MusicArtist:
      type: object
      required:
      - id
      - name
      - albumCount
      - trackCount
      properties:
        id:
          type: string
        name:
          type: string
        albumCount:
          type: integer
          minimum: 0
        trackCount:
          type: integer
          minimum: 0
        artworkUrl:
          type: string
    MusicAlbum:
      type: object
      required:
      - id
      - artist
      - title
      - trackCount
      properties:
        id:
          type: string
        artist:
          type: string
        title:
          type: string
        year:
          type: integer
        trackCount:
          type: integer
          minimum: 0
        artworkUrl:
          type: string
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
    MusicLanding:
      type: object
      required:
      - totalTracks
      - recentlyPlayed
      - recentlyAdded
      - artists
      - albums
      properties:
        totalTracks:
          type: integer
          minimum: 0
        recentlyPlayed:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        recentlyAdded:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        artists:
          type: array
          items:
            $ref: '#/components/schemas/MusicArtist'
        albums:
          type: array
          items:
            $ref: '#/components/schemas/MusicAlbum'
    MusicArtistDetails:
      type: object
      required:
      - artist
      - albums
      properties:
        artist:
          $ref: '#/components/schemas/MusicArtist'
        albums:
          type: array
          items:
            $ref: '#/components/schemas/MusicAlbum'
    MusicAlbumDetails:
      type: object
      required:
      - album
      properties:
        album:
          $ref: '#/components/schemas/MusicAlbum'
    Notification:
      type: object
      required:
      - id
      - kind
      - seriesId
      - seriesTitle
      - season
      - episode
      - createdAt
      properties:
        id:
          type: string
        kind:
          type: string
          const: series_episode_released
        seriesId:
          type: string
        seriesTitle:
          type: string
        season:
          type: integer
          minimum: 0
        episode:
          type: integer
          minimum: 0
        episodeTitle:
          type: string
        releaseDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
    NotificationPage:
      type: object
      required:
      - items
      - total
      - unread
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        total:
          type: integer
          minimum: 0
        unread:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
