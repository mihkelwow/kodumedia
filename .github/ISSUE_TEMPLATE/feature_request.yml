name: Feature request
description: Suggest an improvement for KoduMedia
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired workflow or outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: devices
    attributes:
      label: Relevant devices or platforms
      placeholder: Windows, iPhone, Samsung Tizen, Chrome, etc.
